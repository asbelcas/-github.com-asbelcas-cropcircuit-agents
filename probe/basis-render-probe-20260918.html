<!doctype html>
<meta charset="utf-8">
<title>CropCircuit renderer capability probe</title>
<p id="s">probe starting</p>
<script>
(async () => {
  const u='https://abacus.jasoncameron.dev/hit/cropcircuit-basis-20260918/render-7f3a9c51';
  try {
    const r=await fetch(u,{cache:'no-store'});
    const t=await r.text();
    document.getElementById('s').textContent='executed '+r.status+' '+t;
  } catch(e) {
    document.getElementById('s').textContent='failed '+e;
  }
})();
</script>
