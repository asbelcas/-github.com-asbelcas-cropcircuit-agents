<!doctype html>
<meta charset="utf-8">
<title>POST_PROBE_START</title>
<body><pre id="s">starting</pre>
<script>
(async()=>{
  const s=document.getElementById('s');
  try{
    const r=await fetch('https://httpbin.org/post',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({probe:'cropcircuit-basis-renderer-test'})
    });
    document.title='POST_PROBE_'+r.status;
    s.textContent='POST_PROBE_'+r.status;
  }catch(e){
    document.title='POST_PROBE_ERROR';
    s.textContent='POST_PROBE_ERROR '+String(e);
  }
})();
</script>
