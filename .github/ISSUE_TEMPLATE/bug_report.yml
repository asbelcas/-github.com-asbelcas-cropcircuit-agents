name: Bug report
description: Report a reproducible problem in a CropCircuit public utility
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. **Do not paste a real farm Workspace backup, private notes, customer information, credentials, or other sensitive operational data.** Use synthetic/minimal examples.
  - type: dropdown
    id: tool
    attributes:
      label: Tool / surface
      options:
        - Farm Ops Pocket Console
        - Universal Farm CSV Mapper
        - Labor tools
        - Chore scheduler / load planner
        - Equipment maintenance / parts / checklist
        - Harvest log
        - Sales log / sales mapper
        - Farmers Market / CSA economics
        - Funding Radar / Explorer
        - Workspace backup / schema
        - JavaScript package / data contract
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Use synthetic values only. Include exact steps and the smallest safe example needed.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / runtime
      placeholder: "Example: Firefox / Windows 11"
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed private farm records, credentials, customer data, and other sensitive information.
          required: true
