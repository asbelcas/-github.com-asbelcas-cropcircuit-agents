name: Publish to WordPress

on:
  workflow_dispatch:
  schedule:
    - cron: '15 17 * * *'  # 1:15 PM ET daily
    - cron: '5 22 * * *'   # 6:05 PM ET daily
    - cron: '45 3 * * *'   # 11:45 PM ET daily
    - cron: '7 2 9 8 *'    # one-time: Aug 9 each year @ 10:07 PM ET

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Log current date and time
        run: |
          echo "Workflow triggered at: $(date)"
          echo "Times are UTC in logs. Michigan is currently UTC-4."

      - name: Wait a random number of seconds
        run: |
          delay=$(( RANDOM % 900 ))
          echo "Waiting $delay seconds before starting..."
          sleep $delay

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Quick preflight: show which expected env names are present (names only, no values)
      - name: Preflight env check
        shell: bash
        run: |
          set -e
          check() { if [ -z "${!1}" ]; then echo "MISSING: $1"; else echo "OK: $1"; fi; }
          echo "Checking OpenAI/WordPress environment variables..."
          check OPENAI_API_KEY
          check SITE_BRAND
          check WP_SITE
          check WP_COM_CLIENT_ID
          check WP_COM_CLIENT_SECRET
          check WP_COM_REFRESH_TOKEN
          check POSTS_PER_RUN
          check WP_USER
          check WP_APPLICATION_PASSWORD

      - name: Run publish script
        env:
          # Old/OpenAI + WordPress.com OAuth style (what your script screenshot showed)
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SITE_BRAND: ${{ secrets.SITE_BRAND }}
          WP_SITE: ${{ secrets.WP_SITE }}
          WP_COM_CLIENT_ID: ${{ secrets.WP_COM_CLIENT_ID }}
          WP_COM_CLIENT_SECRET: ${{ secrets.WP_COM_CLIENT_SECRET }}
          WP_COM_REFRESH_TOKEN: ${{ secrets.WP_COM_REFRESH_TOKEN }}
          POSTS_PER_RUN: ${{ secrets.POSTS_PER_RUN }}

          # Alternative basic auth to self-hosted WP (harmless if unused)
          WP_USER: ${{ secrets.WP_USER }}
          WP_APPLICATION_PASSWORD: ${{ secrets.WP_APPLICATION_PASSWORD }}
        run: python publish.py
