name: Publish to WordPress (Randomized Times)

on:
  workflow_dispatch:
  schedule:
    - cron: '15 13 * * *'
    - cron: '5 18 * * *'
    - cron: '45 23 * * *'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Wait a random number of seconds (up to 900)
        run: |
          delay=$(( RANDOM % 900 ))
          echo "Waiting $delay seconds before starting…"
          sleep $delay

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run publish.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SITE_BRAND: ${{ secrets.SITE_BRAND }}
          WP_SITE: ${{ secrets.WP_SITE }}
          WP_COM_CLIENT_ID: ${{ secrets.WP_COM_CLIENT_ID }}
          WP_COM_CLIENT_SECRET: ${{ secrets.WP_COM_CLIENT_SECRET }}
          WP_COM_REFRESH_TOKEN: ${{ secrets.WP_COM_REFRESH_TOKEN }}
          POSTS_PER_RUN: ${{ secrets.POSTS_PER_RUN }}
        run: python publish.py
