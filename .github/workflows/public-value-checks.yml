name: Public value checks

on:
  push:
    paths:
      - "public_value/**"
      - ".github/workflows/public-value-checks.yml"
  pull_request:
    paths:
      - "public_value/**"
      - ".github/workflows/public-value-checks.yml"
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-public-value:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate funding radar freshness and structure
        run: node public_value/validate_funding_radar.mjs
      - name: Check JavaScript syntax
        run: |
          node --check public_value/funding_widget.js
          node --check public_value/farm_math.js
          node --check public_value/farm_chore_payback.js
      - name: Test farm math
        run: node public_value/farm_math.test.mjs
      - name: Test funding query
        run: node public_value/funding_query.test.mjs
      - name: Test benchmark privacy and aggregation
        run: node public_value/benchmark_aggregate.test.mjs
      - name: Test labor-log benchmark transform
        run: node public_value/labor_log_to_benchmark.test.mjs
      - name: Test workflow experiment math
        run: node public_value/workflow_experiment.test.mjs
      - name: Validate farm chore taxonomy
        run: node public_value/validate_chore_taxonomy.mjs
      - name: Validate synthetic labor data contract
        run: |
          node public_value/validate_labor_contract.mjs public_value/examples/synthetic_labor_log_before.csv public_value/examples/synthetic_labor_log_after.csv
      - name: Validate offline asset cache
        run: node public_value/validate_offline_assets.mjs
      - name: Validate tabular data packages
        run: node public_value/validate_data_packages.mjs
      - name: Test farm labor data contract helpers
        run: node public_value/labor_contract.test.mjs
      - name: Test recurring farm schedule math
        run: node public_value/schedule_math.test.mjs
      - name: Test local-first workspace helpers
        run: node public_value/workspace.test.mjs
      - name: Test farm sales economics
        run: |
          node public_value/market_math.test.mjs
          node public_value/csa_math.test.mjs
      - name: Test equipment maintenance math
        run: node public_value/equipment_math.test.mjs
      - name: Test harvest summary math
        run: node public_value/harvest_math.test.mjs
